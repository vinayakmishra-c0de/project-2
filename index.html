<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>
  <div id="app" class="flex-1 flex flex-col"></div>

  <script>
    /* =====================================================================
       🔥 FIREBASE CONFIGURATION - PASTE YOUR CONFIDENTIALS HERE
       Firebase Console -> Project Settings -> General -> Your apps -> Web App (</>)
       Replace the placeholder values below with your real project credentials.
       ===================================================================== */
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };
    /* ============================ END FIREBASE CONFIG ============================ */

    // --- Firebase Initialization & Detection ---
    let isFirebaseConfigured = Boolean(
      window.firebase &&
      firebaseConfig &&
      firebaseConfig.apiKey &&
      firebaseConfig.apiKey !== "YOUR_API_KEY" &&
      firebaseConfig.projectId &&
      firebaseConfig.projectId !== "YOUR_PROJECT_ID"
    );

    let fbAuth = null;
    let fbDb = null;

    if (isFirebaseConfigured) {
      try {
        firebase.initializeApp(firebaseConfig);
        fbAuth = firebase.auth();
        fbDb = firebase.firestore();
        try { fbDb.enablePersistence({ synchronizeTabs: true }); } catch (pe) {}
      } catch (err) {
        console.warn("Firebase Init failed, running in local fallback mode:", err);
        isFirebaseConfigured = false;
      }
    }

    // --- Persistence & Auth Services (Live Firestore + Auth with Offline Fallback) ---
    const firebaseAuthService = {
      async signIn(email, password) {
        if (isFirebaseConfigured && fbAuth) {
          const cred = await fbAuth.signInWithEmailAndPassword(email, password);
          const user = {
            uid: cred.user.uid,
            email: cred.user.email,
            displayName: cred.user.displayName || (cred.user.email ? cred.user.email.split('@')[0] : 'Administrator'),
            role: 'Head Accountant & Registrar'
          };
          localStorage.setItem('attendance_auth_user_v1', JSON.stringify(user));
          return user;
        }
        // Local Demo Mode Fallback
        await new Promise(r => setTimeout(r, 150));
        if (email && password) {
          const user = { uid: 'admin_01', email, displayName: email.split('@')[0] || 'Rajesh Sharma', role: 'Head Accountant & Registrar' };
          localStorage.setItem('attendance_auth_user_v1', JSON.stringify(user));
          return user;
        }
        throw new Error('Please enter valid email and password');
      },
      async signOut() {
        if (isFirebaseConfigured && fbAuth) {
          try { await fbAuth.signOut(); } catch (e) {}
        }
        localStorage.removeItem('attendance_auth_user_v1');
        return true;
      },
      getCurrentUser() {
        if (isFirebaseConfigured && fbAuth?.currentUser) {
          const u = fbAuth.currentUser;
          return { uid: u.uid, email: u.email, displayName: u.displayName || u.email?.split('@')[0] || 'Administrator', role: 'Head Accountant & Registrar' };
        }
        const s = localStorage.getItem('attendance_auth_user_v1');
        return s ? JSON.parse(s) : { uid: 'admin_01', email: 'accountant@apexacademy.edu', displayName: 'Rajesh Sharma', role: 'Head Accountant & Registrar' };
      }
    };
    const mockFirebaseAuthService = firebaseAuthService; // alias for seamless compatibility

    const firestoreService = {
      async fetchStudents() {
        if (isFirebaseConfigured && fbDb) {
          try {
            const snap = await fbDb.collection('students').get();
            if (!snap.empty) {
              const students = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              localStorage.setItem('attendance_students_records_v1', JSON.stringify(students));
              return students;
            } else {
              const seeds = getInitialSeedStudents();
              const batch = fbDb.batch();
              seeds.forEach(s => { batch.set(fbDb.collection('students').doc(s.id), s); });
              await batch.commit();
              localStorage.setItem('attendance_students_records_v1', JSON.stringify(seeds));
              return seeds;
            }
          } catch (err) {
            console.warn("Firestore fetch error, reading from local cache:", err);
          }
        }
        const s = localStorage.getItem('attendance_students_records_v1');
        if (s) { try { return JSON.parse(s); } catch(e){} }
        return getInitialSeedStudents();
      },

      async saveStudents(arr) {
        localStorage.setItem('attendance_students_records_v1', JSON.stringify(arr));
        if (isFirebaseConfigured && fbDb) {
          try {
            const batch = fbDb.batch();
            arr.forEach(s => { batch.set(fbDb.collection('students').doc(s.id), s); });
            await batch.commit();
          } catch (err) {
            console.error("Firestore saveStudents error:", err);
          }
        }
        return true;
      },

      async fetchRecycleBin() {
        if (isFirebaseConfigured && fbDb) {
          try {
            const snap = await fbDb.collection('recycle_bin').get();
            const items = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            localStorage.setItem('attendance_recycle_bin_v1', JSON.stringify(items));
            return items;
          } catch (err) {
            console.warn("Firestore fetchRecycleBin error, reading from local cache:", err);
          }
        }
        const s = localStorage.getItem('attendance_recycle_bin_v1');
        if (s) { try { return JSON.parse(s); } catch(e){} }
        return [];
      },

      async saveRecycleBin(arr) {
        localStorage.setItem('attendance_recycle_bin_v1', JSON.stringify(arr));
        if (isFirebaseConfigured && fbDb) {
          try {
            const snap = await fbDb.collection('recycle_bin').get();
            const batch = fbDb.batch();
            snap.docs.forEach(doc => {
              if (!arr.some(item => item.id === doc.id)) batch.delete(doc.ref);
            });
            arr.forEach(item => { batch.set(fbDb.collection('recycle_bin').doc(item.id), item); });
            await batch.commit();
          } catch (err) {
            console.error("Firestore saveRecycleBin error:", err);
          }
        }
        return true;
      }
    };
    const mockFirestoreService = firestoreService; // alias for seamless compatibility

    // --- Student Factory & Seed Data ---
    function mkStudent(d) {
      const remainingDue = Math.max(0, d.fee - d.paid);
      return {
        id: d.id, sequenceNo: d.seq, academicYear: d.year || '2026-2027', attendance: d.att, fullName: d.name,
        motherName: d.mother || 'Sunita Sharma', fatherName: d.father, gender: d.gender || 'Male', dob: d.dob,
        age: d.age || calculateAge(d.dob), religion: d.religion || 'Hindu', casteCategory: d.caste || 'General',
        nationality: 'Indian', onlyChild: d.onlyChild || 'No', speciallyAbled: d.speciallyAbled || 'No',
        disabilityType: d.disabilityType || '', annualFamilyIncome: d.income || 600000, tenthPassingYear: d.tenthYear || '2025',
        tenthMarksPercentage: d.tenthMarks || 88.5, tenthRollNo: d.tenthRoll || 'CBSE-2025-01', tenthBoard: d.tenthBoard || 'CBSE',
        tenthBoardOther: '', optedClass: d.grade, optedStream: d.stream, residentialAddress: d.addr,
        contactNumber: d.phone, whatsappNumber: d.phone, email: d.email || `${d.name.toLowerCase().replace(/[^a-z]/g, '')}@gmail.com`,
        totalFee: d.fee, paymentPlan: d.plan || (d.inst?.length ? 'Installment Plan' : 'Full Payment'),
        fullPaymentDetails: d.fullPay || (d.plan === 'Full Payment' ? { date: '2026-04-01', mode: 'UPI', reference: 'UPI/' + d.id } : null),
        installments: d.inst || [], totalPaid: d.paid, remainingDue,
        feeStatus: remainingDue === 0 ? 'Full Paid' : (d.paid > 0 ? 'Active Dues' : 'Pending'),
        createdAt: '2026-04-05T10:00:00Z', updatedAt: '2026-08-10T12:00:00Z'
      };
    }

    function getInitialSeedStudents() {
      return [

        mkStudent({ id: 'std_002', seq: '2026-11-PCB-002', att: 'Non-Attending', name: 'Ananya Mehra', father: 'Vikram Mehra', gender: 'Female', dob: '2009-11-22', grade: 'Class 11', stream: 'PCB', phone: '9450123987', addr: 'A-104 Palm Grove, Lucknow - 226010', fee: 80000, paid: 80000, plan: 'Full Payment' }),
        mkStudent({ id: 'std_003', seq: '2026-12-Commerce-001', att: 'Attending', name: 'Rohan Jayant Kulkarni', father: 'Jayant Kulkarni', dob: '2008-05-19', caste: 'OBC', tenthBoard: 'State Board', grade: 'Class 12', stream: 'Commerce', phone: '9822998877', addr: 'Sai Shraddha, Pune - 411038', fee: 65000, paid: 47500, inst: [{ id: 1, title: 'Installment 1', dueDate: '2026-04-10', scheduledAmount: 32500, paidAmount: 32500, status: 'Paid', mode: 'Cheque' }, { id: 2, title: 'Installment 2', dueDate: '2026-09-10', scheduledAmount: 32500, paidAmount: 15000, status: 'Partial', mode: 'Cash' }] }),
        mkStudent({ id: 'std_004', seq: '2026-12-Arts-001', att: 'Attending', name: 'Fatima Zohra', father: 'Syed Tariq Ali', gender: 'Female', religion: 'Muslim', dob: '2008-09-03', grade: 'Class 12', stream: 'Arts / Humanities', phone: '9837112233', addr: '14-B Civil Lines, Aligarh - 202001', fee: 60000, paid: 60000, plan: 'Full Payment' }),
        mkStudent({ id: 'std_005', seq: '2026-11-PCM-002', att: 'Non-Attending', name: 'Kabir Singhania', father: 'Harsh Singhania', dob: '2009-03-30', grade: 'Class 11', stream: 'PCM', phone: '9900881122', addr: 'Villa 18, Whitefield, Bengaluru - 560066', fee: 85000, paid: 0, inst: [{ id: 1, title: 'Installment 1', dueDate: '2026-04-15', scheduledAmount: 42500, paidAmount: 0, status: 'Unpaid', mode: 'Cash' }, { id: 2, title: 'Installment 2', dueDate: '2026-10-15', scheduledAmount: 42500, paidAmount: 0, status: 'Unpaid', mode: 'Cash' }] }),
        mkStudent({ id: 'std_006', seq: '2026-12-PCB-001', att: 'Non-Attending', name: 'Ishaan Verma', father: 'Dr. Alok Verma', dob: '2008-12-05', grade: 'Class 12', stream: 'PCB', phone: '9888123456', addr: 'Model Town, Jalandhar - 144003', fee: 80000, paid: 80000, plan: 'Full Payment' }),
        mkStudent({ id: 'std_007', seq: '2026-11-Commerce-001', att: 'Attending', name: 'Tanya Gurung', father: 'Bikram Gurung', gender: 'Female', religion: 'Buddhist', caste: 'ST', dob: '2009-06-18', grade: 'Class 11', stream: 'Commerce', phone: '9733004455', addr: 'Hill Cart Road, Darjeeling - 734101', fee: 65000, paid: 32500, inst: [{ id: 1, title: 'Installment 1', dueDate: '2026-04-10', scheduledAmount: 32500, paidAmount: 32500, status: 'Paid', mode: 'UPI' }, { id: 2, title: 'Installment 2', dueDate: '2026-10-10', scheduledAmount: 32500, paidAmount: 0, status: 'Unpaid', mode: 'Cash' }] }),
        mkStudent({ id: 'std_008', seq: '2026-11-Arts-001', att: 'Non-Attending', name: 'Arjun Nambiar', father: 'Suresh Nambiar', dob: '2009-02-14', speciallyAbled: 'Yes', disabilityType: 'Hearing Impairment', grade: 'Class 11', stream: 'Arts / Humanities', phone: '9447118899', addr: 'Panampilly Nagar, Kochi - 682036', fee: 60000, paid: 60000, plan: 'Full Payment' })
      ];
    }

    // --- State & Helpers ---
    function getCurrentAcademicYear() { const n = new Date(), y = n.getFullYear(); return (n.getMonth() + 1 >= 4) ? `${y}-${y + 1}` : `${y - 1}-${y}`; }
    function loadAcademicYears() {
      const cur = getCurrentAcademicYear(), st = localStorage.getItem('attendance_academic_years_v1');
      let l = ['2026-2027', '2025-2026', '2024-2025', '2027-2028'];
      if (st) { try { const p = JSON.parse(st); if (Array.isArray(p) && p.length) l = p; } catch(e){} }
      if (!l.includes(cur)) l.unshift(cur); return l;
    }

    const defaultAcademicYear = getCurrentAcademicYear();
    const state = {
      isLoggedIn: true, currentUser: mockFirebaseAuthService.getCurrentUser(), isOnline: navigator.onLine,
      students: [], recycleBin: [], selectedIds: new Set(), recycleBinSelectedIds: new Set(), recycleBinConfirmEmpty: false,
      academicYears: loadAcademicYears(), filters: { academicYear: defaultAcademicYear, grade: 'all', attendance: 'all', stream: 'all', search: '', feeStatus: 'all' },
      pagination: { currentPage: 1, pageSize: 10 }, activeModal: null, editingStudentId: null, viewingStudentId: null,
      safetyDeleteContext: null, formTab: 'demographics', importDataState: { rawRows: [], parsedRows: [], step: 'upload' }
    };

    function showToast(title, message = '', type = 'info') {
      const c = document.getElementById('toast-container'); if (!c) return;
      const t = document.createElement('div'), bg = type === 'success' ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : type === 'error' ? 'bg-rose-50 border-rose-200 text-rose-900' : type === 'warning' ? 'bg-amber-50 border-amber-200 text-amber-900' : 'bg-slate-900 border-slate-800 text-white';
      const icon = type === 'success' ? 'fa-circle-check text-emerald-500' : type === 'error' ? 'fa-circle-xmark text-rose-500' : type === 'warning' ? 'fa-triangle-exclamation text-amber-500' : 'fa-circle-info text-indigo-400';
      t.className = `pointer-events-auto flex items-start gap-3 p-4 rounded-xl shadow-lg border text-sm transition-all duration-300 transform translate-y-2 opacity-0 ${bg}`;
      t.innerHTML = `<i class="fa-solid ${icon} text-lg mt-0.5"></i><div class="flex-1"><p class="font-semibold">${escapeHtml(title)}</p>${message ? `<p class="text-xs opacity-90 mt-0.5">${escapeHtml(message)}</p>` : ''}</div><button onclick="this.parentElement.remove()" class="text-xs opacity-60 hover:opacity-100 transition-opacity ml-2"><i class="fa-solid fa-xmark"></i></button>`;
      c.appendChild(t); requestAnimationFrame(() => t.classList.remove('translate-y-2', 'opacity-0'));
      setTimeout(() => { t.classList.add('opacity-0', 'translate-y-2'); setTimeout(() => t.remove(), 300); }, 4000);
    }

    function escapeHtml(s) { return s ? String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;') : ''; }
    function formatCurrency(n) { return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(Number(n) || 0); }
    function formatDate(d) { if (!d) return '—'; const dt = new Date(d); return isNaN(dt) ? d : dt.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }); }
    function calculateAge(d) { if (!d) return 0; const dt = new Date(d); return isNaN(dt) ? 0 : Math.abs(new Date(Date.now() - dt.getTime()).getUTCFullYear() - 1970); }

    function generateNextSequenceNo(year, grade, stream) {
      const y = (year || state.filters.academicYear || defaultAcademicYear).split('-')[0], g = (grade || 'Class 11').replace('Class ', '').trim();
      const s = (stream || '').includes('PCB') ? 'PCB' : (stream || '').includes('Commerce') ? 'Commerce' : (stream || '').includes('Arts') ? 'Arts' : 'PCM';
      const prefix = `${y}-${g}-${s}`; return `${prefix}-${(state.students.filter(st => st.sequenceNo?.startsWith(prefix)).length + 1).toString().padStart(3, '0')}`;
    }

    function normalizeStream(v) {
      const s = String(v || '').trim().toLowerCase();
      return /pcb|bio|medical/i.test(s) ? 'PCB' : /pcm|math/i.test(s) ? 'PCM' : /comm|account|bus/i.test(s) ? 'Commerce' : /art|human/i.test(s) ? 'Arts / Humanities' : 'PCM';
    }
    function normalizeAttendance(v) { return /non-attending|non attending|dummy|external|coaching|no|0/i.test(String(v || '').trim()) ? 'Non-Attending' : 'Attending'; }
    function normalizeDate(v) {
      if (!v) return '2009-01-01';
      if (typeof v === 'number' || (!isNaN(v) && !String(v).includes('-') && !String(v).includes('/'))) {
        const s = Number(v); if (s > 10000 && s < 60000) return new Date(Math.round((s - 25569) * 86400 * 1000)).toISOString().split('T')[0];
      }
      const str = String(v).trim();
      if (/^\d{4}-\d{1,2}-\d{1,2}$/.test(str)) { const p = str.split('-'); return `${p[0]}-${p[1].padStart(2, '0')}-${p[2].padStart(2, '0')}`; }
      if (/^\d{1,2}[-\/]\d{1,2}[-\/]\d{4}$/.test(str)) { const p = str.split(/[-\/]/); return `${p[2]}-${p[1].padStart(2, '0')}-${p[0].padStart(2, '0')}`; }
      const d = new Date(str); return !isNaN(d) ? d.toISOString().split('T')[0] : '2009-01-01';
    }

    function getFilteredStudents() {
      const { academicYear, grade, attendance, stream, search, feeStatus } = state.filters, q = search.trim().toLowerCase();
      return state.students.filter(s => {
        if (academicYear && academicYear !== 'all' && s.academicYear !== academicYear) return false;
        if (grade !== 'all' && (s.optedClass.includes('11') ? '11' : '12') !== grade) return false;
        if (attendance !== 'all' && s.attendance !== attendance) return false;
        if (stream !== 'all' && !s.optedStream.includes(stream)) return false;
        if (feeStatus !== 'all' && s.feeStatus !== feeStatus) return false;
        if (q && ![s.sequenceNo, s.fullName, s.contactNumber, s.fatherName].some(f => (f || '').toLowerCase().includes(q))) return false;
        return true;
      });
    }

    // --- Exports ---
    function exportToExcel(records, prefix = 'Students_Registry') {
      if (!window.XLSX) return showToast('SheetJS Missing', 'Excel library not loaded.', 'error');
      const rows = records.map((s, i) => ({ 'S.No': i + 1, 'Sequence ID': s.sequenceNo, 'Academic Year': s.academicYear, 'Attendance': s.attendance, 'Student Name': s.fullName, 'Father Name': s.fatherName, 'Mother Name': s.motherName, 'Gender': s.gender, 'DOB': s.dob, 'Age': s.age, 'Class': s.optedClass, 'Stream': s.optedStream, 'Contact': s.contactNumber, 'Email': s.email, 'Address': s.residentialAddress, 'Category': s.casteCategory, 'Total Fee': s.totalFee, 'Paid': s.totalPaid, 'Due': s.remainingDue, 'Status': s.feeStatus }));
      const ws = XLSX.utils.json_to_sheet(rows); ws['!cols'] = Object.keys(rows[0] || {}).map(k => ({ wch: Math.max(k.length, 12) }));
      const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Students');
      XLSX.writeFile(wb, `${prefix}_${state.filters.academicYear}_${new Date().toISOString().slice(0, 10)}.xlsx`);
      showToast('Export Completed', `Exported ${records.length} records to Excel.`, 'success');
    }

    function exportToCSV(records, prefix = 'Students_Data') {
      if (!window.XLSX) return;
      const rows = records.map(s => ({ 'Sequence ID': s.sequenceNo, 'Attendance': s.attendance, 'Name': s.fullName, 'Father Name': s.fatherName, 'Class': s.optedClass, 'Stream': s.optedStream, 'Contact': s.contactNumber, 'DOB': s.dob, 'Total Fee': s.totalFee, 'Paid': s.totalPaid, 'Due': s.remainingDue, 'Status': s.feeStatus }));
      const csv = XLSX.utils.sheet_to_csv(XLSX.utils.json_to_sheet(rows));
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
      a.download = `${prefix}_${new Date().toISOString().slice(0, 10)}.csv`; a.click();
      showToast('CSV Exported', 'CSV file generated successfully for Google Sheets.', 'success');
    }

    function downloadSampleExcelTemplate() {
      if (!window.XLSX) return;
      const sample = [
        { 'Full Name': 'Kabir Rao', 'Father Name': 'Vikram Rao', 'Attendance': 'Attending', 'Class': 'Class 11', 'Stream': 'PCM', 'Date of Birth': '2009-05-14', 'Gender': 'Male', 'Contact Number': '9876543210', 'Total Course Fee': 75000, 'Paid Amount': 25000 },
        { 'Full Name': 'Sanya Kapoor', 'Father Name': 'Ramesh Kapoor', 'Attendance': 'Non-Attending', 'Class': 'Class 12', 'Stream': 'PCB', 'Date of Birth': '2008-08-12', 'Gender': 'Female', 'Contact Number': '9812345678', 'Total Course Fee': 80000, 'Paid Amount': 80000 },
        { 'Full Name': 'Devansh Agarwal', 'Father Name': 'Nitin Agarwal', 'Attendance': 'Attending', 'Class': 'Class 11', 'Stream': 'Commerce', 'Date of Birth': '2009-10-25', 'Gender': 'Male', 'Contact Number': '9822334455', 'Total Course Fee': 65000, 'Paid Amount': 32500 }
      ];
      const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(sample), 'Template');

    async function executeSoftDelete() {
      const ctx = state.safetyDeleteContext; if (!ctx?.ids.length) return;
      const set = new Set(ctx.ids), deleted = state.students.filter(s => set.has(s.id)), now = new Date().toISOString();
      state.students = state.students.filter(s => !set.has(s.id));
      state.recycleBin = [...deleted.map(s => ({ ...s, deletedAt: now, deletedBy: state.currentUser.displayName || 'Administrator' })), ...state.recycleBin];
      state.selectedIds.clear(); state.activeModal = null; state.safetyDeleteContext = null;
      await mockFirestoreService.saveStudents(state.students); await mockFirestoreService.saveRecycleBin(state.recycleBin);
      showToast('Moved to Recycle Bin', `${deleted.length} record(s) moved to Recycle Bin.`, 'warning'); render();
    }

    async function executeHardDelete() {
      const ctx = state.safetyDeleteContext; if (!ctx?.ids.length) return;
      const set = new Set(ctx.ids), count = ctx.ids.length;
      state.students = state.students.filter(s => !set.has(s.id));
      state.selectedIds.clear(); state.activeModal = null; state.safetyDeleteContext = null;
      await mockFirestoreService.saveStudents(state.students);

      showToast('Record Restored', `${item.fullName} restored to active registry.`, 'success'); render();

    function renderStudentRegistry() {

            <thead>
              <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 font-bold uppercase tracking-wider text-xs">
                <th class="py-4 px-4 w-10 text-center"><input type="checkbox" ${allPageSelected ? 'checked' : ''} onchange="toggleSelectAllPage(this.checked, ${JSON.stringify(pageStudents.map(s=>s.id)).replace(/"/g, '&quot;')})" class="rounded text-indigo-600 focus:ring-indigo-500 border-slate-300 w-4 h-4 cursor-pointer" /></th>
                <th class="py-4 px-3">Sequence ID</th><th class="py-4 px-4">Student Details</th><th class="py-4 px-3">Class &amp; Stream</th><th class="py-4 px-4">Parent Details</th><th class="py-4 px-3">DOB &amp; Gender</th><th class="py-4 px-4">Fee Status</th><th class="py-4 px-4 text-right">Actions</th>

                  <td class="py-4 px-3 whitespace-nowrap"><div class="flex flex-col gap-1"><span class="font-bold text-slate-900 text-sm">${escapeHtml(s.optedClass)}</span><span class="inline-block text-xs font-bold px-2.5 py-0.5 rounded-md border w-fit ${streamColor}">${escapeHtml(s.optedStream)}</span></div></td>

                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
        <div class="lg:hidden divide-y divide-slate-100 p-3 sm:p-4 space-y-3">
          ${pageStudents.map(s => {
            const isSel = state.selectedIds.has(s.id), isAtt = s.attendance === 'Attending';
            const initials = (s.fullName || 'ST').split(' ').map(n=>n[0]).join('').substring(0,2);
            return `<div class="bg-white border rounded-xl p-4 shadow-2xs space-y-3 ${isSel ? 'border-indigo-400 bg-indigo-50/20' : 'border-slate-200'}">
              <div class="flex items-center justify-between"><div class="flex items-center gap-2"><input type="checkbox" ${isSel ? 'checked' : ''} onchange="toggleSelectStudent('${s.id}')" class="rounded text-indigo-600 focus:ring-indigo-500 border-slate-300 w-4 h-4 cursor-pointer" /><span class="font-mono text-xs font-bold text-slate-700 bg-slate-100 px-2 py-0.5 rounded border border-slate-200">${escapeHtml(s.sequenceNo)}</span></div><span class="inline-flex items-center gap-1 text-[11px] font-bold px-2 py-0.5 rounded-full border ${isAtt ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-purple-50 text-purple-700 border-purple-200'}"><i class="fa-solid ${isAtt ? 'fa-school' : 'fa-laptop-file'} text-[10px]"></i> ${escapeHtml(s.attendance)}</span></div>
              <div class="flex items-start gap-3"><div class="w-10 h-10 rounded-full ${isAtt ? 'bg-emerald-100 text-emerald-700' : 'bg-purple-100 text-purple-700'} font-bold flex items-center justify-center text-sm shrink-0 border">${escapeHtml(initials)}</div><div class="flex-1"><h4 class="font-bold text-slate-900 text-sm leading-tight hover:text-indigo-600 cursor-pointer" onclick="openProfileViewModal('${s.id}')">${escapeHtml(s.fullName)}</h4><p class="text-xs text-slate-500 mt-0.5"><span class="font-semibold text-slate-700">${escapeHtml(s.optedClass)}</span> &bull; <span class="font-medium text-indigo-700">${escapeHtml(s.optedStream)}</span></p><p class="text-xs text-slate-600 mt-1">Father: <span class="font-medium text-slate-800">${escapeHtml(s.fatherName)}</span> (${escapeHtml(s.contactNumber)})</p></div></div>
              <div class="flex items-center justify-between bg-slate-50 p-2.5 rounded-lg border border-slate-100 text-xs"><div><span class="text-slate-500 font-medium">Fee:</span> <strong class="${s.feeStatus === 'Full Paid' ? 'text-emerald-700' : s.feeStatus === 'Active Dues' ? 'text-rose-700' : 'text-amber-700'} font-bold ml-1">${escapeHtml(s.feeStatus)}</strong></div><div class="text-right"><span class="text-slate-500">Paid:</span> <strong class="text-emerald-600">${formatCurrency(s.totalPaid)}</strong> / ${formatCurrency(s.totalFee)}</div></div>
              <div class="flex items-center justify-end gap-2 pt-1 border-t border-slate-100"><button onclick="openProfileViewModal('${s.id}')" class="px-2.5 py-1 text-xs font-semibold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 rounded-md border border-indigo-200 cursor-pointer">View</button><button onclick="openExcelPreviewModal('${s.id}')" class="px-2.5 py-1 text-xs font-semibold text-emerald-700 bg-emerald-50 hover:bg-emerald-100 rounded-md border border-emerald-200 cursor-pointer">Excel</button><button onclick="openEditStudentModal('${s.id}')" class="px-2.5 py-1 text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-md cursor-pointer">Edit</button><button onclick="triggerDeleteStudent('${s.id}')" class="px-2.5 py-1 text-xs font-semibold text-rose-600 bg-rose-50 hover:bg-rose-100 rounded-md border border-rose-200 cursor-pointer">Delete</button></div>
            </div>`;
          }).join('')}
        </div>
        <div class="bg-slate-50 border-t border-slate-200 px-4 py-3 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs">
          <div class="text-slate-500">Showing <span class="font-bold text-slate-800">${startIndex + 1}</span> to <span class="font-bold text-slate-800">${Math.min(startIndex + pageSize, totalCount)}</span> of <span class="font-bold text-slate-800">${totalCount}</span> students</div>

    function renderSafetyDeleteModal() {

      return `<div class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop animate-fade-in"><div class="bg-white rounded-2xl shadow-2xl max-w-md w-full border border-slate-200 overflow-hidden">

          </div>
        </div>

      </div></div>`;
    }

              <button type="button" onclick="restoreSelectedRecycleBin()" class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-lg shadow-2xs transition-colors cursor-pointer"><i class="fa-solid fa-rotate-left"></i><span>Recover Selected (${selCount})</span></button>
              <button type="button" onclick="purgeSelectedRecycleBin()" class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs rounded-lg shadow-2xs transition-colors cursor-pointer"><i class="fa-solid fa-trash-can"></i><span>Delete Selected Permanently (${selCount})</span></button>
              <button type="button" onclick="state.recycleBinSelectedIds.clear();render();" class="px-2 py-1 text-xs text-slate-600 hover:text-slate-900 font-semibold cursor-pointer">Deselect All</button>

          </div>
          <div class="flex items-center gap-2">
            <button type="button" onclick="restoreAllRecycleBin()" ${bin.length === 0 ? 'disabled class="opacity-40 cursor-not-allowed px-3 py-1.5 bg-slate-200 text-slate-500 font-bold text-xs rounded-lg flex items-center gap-1.5"' : 'class="inline-flex items-center gap-1.5 px-3.5 py-1.5 bg-emerald-700 hover:bg-emerald-800 text-white font-bold text-xs rounded-lg shadow-2xs transition-colors cursor-pointer"'}><i class="fa-solid fa-rotate-left"></i><span>Recover All (${bin.length})</span></button>
            <button type="button" onclick="triggerDeleteAllBinModal()" ${bin.length === 0 ? 'disabled class="opacity-40 cursor-not-allowed px-3 py-1.5 bg-slate-200 text-slate-500 font-bold text-xs rounded-lg flex items-center gap-1.5"' : 'class="inline-flex items-center gap-1.5 px-3.5 py-1.5 bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs rounded-lg shadow-2xs transition-colors cursor-pointer"'}><i class="fa-solid fa-dumpster-fire"></i><span>Delete All Bin Permanently</span></button>
          </div>
        </div>
        ${state.recycleBinConfirmEmpty ? `
          <div class="bg-rose-50 border-y-2 border-rose-300 p-4 px-5 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs animate-fade-in shadow-inner">
            <div class="flex items-center gap-3 text-rose-950 font-bold"><div class="w-8 h-8 rounded-full bg-rose-600 text-white flex items-center justify-center text-sm shrink-0"><i class="fa-solid fa-triangle-exclamation"></i></div><div><p class="text-sm font-extrabold text-rose-900">Are you sure you want to permanently delete ALL ${bin.length} student records?</p><p class="text-xs text-rose-700 font-medium">This will purge all deleted students from the database forever. This action cannot be undone.</p></div></div>
            <div class="flex items-center gap-2 shrink-0"><button type="button" onclick="confirmEmptyRecycleBinNow()" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white font-extrabold text-xs rounded-lg shadow-sm transition-colors flex items-center gap-1.5 cursor-pointer"><i class="fa-solid fa-trash-can"></i> Yes, Permanently Delete All</button><button type="button" onclick="state.recycleBinConfirmEmpty=false;render();" class="px-3.5 py-2 bg-white border border-slate-300 text-slate-700 hover:bg-slate-100 font-bold text-xs rounded-lg transition-colors cursor-pointer">Cancel</button></div>

      e.preventDefault();
      try {
        const u = await mockFirebaseAuthService.signIn(document.getElementById('login-email').value, document.getElementById('login-password').value);
        state.currentUser = u; state.isLoggedIn = true; showToast('Welcome Back', `Signed in as ${u.displayName}`, 'success'); render();
      } catch (err) { showToast('Login Failed', err.message, 'error'); }
    }

    async function handleLogout() {
      await mockFirebaseAuthService.signOut(); state.isLoggedIn = false; state.currentUser = null;
      showToast('Signed Out', 'Safely logged out.', 'info'); render();
    }

    function toggleDropdown(id) { const m = document.getElementById(id); if (m) m.classList.toggle('hidden'); }

      ['export-menu', 'batch-menu'].forEach(id => {
        const el = document.getElementById(id);
        if (el && !el.classList.contains('hidden') && !el.contains(e.target) && !el.previousElementSibling?.contains(e.target)) el.classList.add('hidden');
      });
    });

    function toggleSelectStudent(id) { state.selectedIds.has(id) ? state.selectedIds.delete(id) : state.selectedIds.add(id); render(); }
    function toggleSelectAllPage(c, ids) { c ? ids.forEach(id => state.selectedIds.add(id)) : ids.forEach(id => state.selectedIds.delete(id)); render(); }

      state.filters = { academicYear: defaultAcademicYear, grade: 'all', attendance: 'all', stream: 'all', search: '', feeStatus: 'all' };

          <td class="py-2 px-3"><select class="inst-mode text-xs p-1 border border-slate-200 rounded"><option value="UPI" ${inst.mode === 'UPI' ? 'selected' : ''}>UPI</option><option value="Cash" ${inst.mode === 'Cash' ? 'selected' : ''}>Cash</option><option value="Cheque" ${inst.mode === 'Cheque' ? 'selected' : ''}>Cheque</option><option value="Bank Transfer" ${inst.mode === 'Bank Transfer' ? 'selected' : ''}>Bank</option></select></td>

    function regenerateInstallmentTable(countStr) {
      const count = Number(countStr) || 3, totalFee = Number(document.getElementById('form-totalfee')?.value) || 75000;
      const per = Math.round(totalFee / count), tbody = document.getElementById('installment-rows-body');
      if (!tbody) return;
      tbody.innerHTML = Array.from({ length: count }, (_, i) => ({
        id: i + 1, title: `Installment ${i + 1}`, dueDate: `2026-${((i + 1) * 2 + 2).toString().padStart(2, '0')}-15`, scheduledAmount: per, paidAmount: i === 0 ? per : 0, status: i === 0 ? 'Paid' : 'Unpaid', mode: 'UPI'
      })).map(inst => `
        <tr class="inst-row" data-id="${inst.id}">
          <td class="py-2 px-3 font-semibold text-slate-800"><input type="text" class="inst-title bg-transparent font-semibold text-slate-800 w-28 focus:outline-none" value="${escapeHtml(inst.title)}" /></td>
          <td class="py-2 px-3"><input type="date" class="inst-duedate text-xs p-1 border border-slate-200 rounded" value="${inst.dueDate}" /></td>
          <td class="py-2 px-3"><input type="number" class="inst-scheduled text-xs p-1 border border-slate-200 rounded w-24 font-bold" oninput="recalculateFeeEngine()" value="${inst.scheduledAmount}" /></td>
          <td class="py-2 px-3"><input type="number" class="inst-paid text-xs p-1 border border-slate-200 rounded w-24 font-bold text-emerald-600" oninput="recalculateFeeEngine()" value="${inst.paidAmount}" /></td>
          <td class="py-2 px-3"><select class="inst-status text-xs p-1 border border-slate-200 rounded font-semibold" onchange="recalculateFeeEngine()"><option value="Paid" ${inst.status === 'Paid' ? 'selected' : ''}>Paid</option><option value="Partial" ${inst.status === 'Partial' ? 'selected' : ''}>Partial</option><option value="Unpaid" ${inst.status === 'Unpaid' ? 'selected' : ''}>Unpaid</option></select></td>
          <td class="py-2 px-3"><select class="inst-mode text-xs p-1 border border-slate-200 rounded"><option value="UPI">UPI</option><option value="Cash">Cash</option><option value="Cheque">Cheque</option><option value="Bank Transfer">Bank</option></select></td>
        </tr>
      `).join('');
      recalculateFeeEngine();
    }

    function recalculateFeeEngine() {
      const totalFeeInput = document.getElementById('form-totalfee'); if (!totalFeeInput) return;
      const totalFee = Number(totalFeeInput.value) || 0;
      let totalPaid = 0;
      if (document.getElementById('form-paymentplan')?.value === 'Full Payment') totalPaid = totalFee;
      else document.querySelectorAll('.inst-paid').forEach(inp => totalPaid += Number(inp.value) || 0);
      const due = Math.max(0, totalFee - totalPaid);
      const kTot = document.getElementById('calc-total-fee'), kPaid = document.getElementById('calc-total-paid'), kDue = document.getElementById('calc-total-due');
      if (kTot) kTot.innerText = formatCurrency(totalFee);
      if (kPaid) kPaid.innerText = formatCurrency(totalPaid);
      if (kDue) { kDue.innerText = formatCurrency(due); kDue.className = due > 0 ? 'text-base font-bold text-rose-600' : 'text-base font-bold text-emerald-600'; }
    }

    async function handleSaveStudent(e) {
      e.preventDefault();
      const isEditing = Boolean(state.editingStudentId), studentId = isEditing ? state.editingStudentId : 'std_' + Date.now();
      const attendance = document.querySelector('input[name="attendance"]:checked')?.value || 'Attending';
      const fullName = document.getElementById('form-fullname')?.value.trim();
      const fatherName = document.getElementById('form-fathername')?.value.trim();
      const motherName = document.getElementById('form-mothername')?.value.trim();
      const contactNumber = document.getElementById('form-contactnumber')?.value.trim();
      const residentialAddress = document.getElementById('form-address')?.value.trim();

      if (!fullName || !fatherName || !motherName || !contactNumber || !residentialAddress) {
        return showToast('Required Fields Missing', 'Please fill all mandatory fields (*)', 'error');
      }

      const totalFee = Number(document.getElementById('form-totalfee')?.value) || 0;
      const paymentPlan = document.getElementById('form-paymentplan')?.value || 'Installment Plan';
      let installments = [], totalPaid = 0, fullPaymentDetails = null;

      if (paymentPlan === 'Full Payment') {
        totalPaid = totalFee; fullPaymentDetails = { date: new Date().toISOString().split('T')[0], mode: 'UPI', reference: 'UPI/' + Date.now() };
      } else {
        document.querySelectorAll('.inst-row').forEach((row, idx) => {
          const sc = Number(row.querySelector('.inst-scheduled')?.value) || 0, pd = Number(row.querySelector('.inst-paid')?.value) || 0;
          totalPaid += pd;
          installments.push({ id: idx + 1, title: row.querySelector('.inst-title')?.value || `Installment ${idx + 1}`, dueDate: row.querySelector('.inst-duedate')?.value || '', scheduledAmount: sc, paidAmount: pd, status: row.querySelector('.inst-status')?.value || 'Unpaid', mode: row.querySelector('.inst-mode')?.value || 'Cash' });
        });
      }

      const remainingDue = Math.max(0, totalFee - totalPaid);
      const optedClass = document.getElementById('form-optedclass')?.value || 'Class 11', optedStream = document.getElementById('form-optedstream')?.value || 'PCM';
      const academicYear = state.filters.academicYear !== 'all' ? state.filters.academicYear : defaultAcademicYear;
      const existing = isEditing ? state.students.find(s => s.id === studentId) : null;
      const sequenceNo = existing ? existing.sequenceNo : generateNextSequenceNo(academicYear, optedClass, optedStream);
      const dob = document.getElementById('form-dob')?.value || '2009-08-15';

      const rec = {
        id: studentId, sequenceNo, academicYear, attendance, fullName, fatherName, motherName,
        gender: document.getElementById('form-gender')?.value || 'Male', dob, age: calculateAge(dob),
        casteCategory: document.getElementById('form-category')?.value || 'General', religion: document.getElementById('form-religion')?.value || 'Hindu',
        nationality: document.getElementById('form-nationality')?.value || 'Indian', annualFamilyIncome: Number(document.getElementById('form-income')?.value) || 0,
        tenthBoard: document.getElementById('form-tenthboard')?.value || 'CBSE', tenthPassingYear: document.getElementById('form-tenthyear')?.value || '2025',
        tenthMarksPercentage: Number(document.getElementById('form-tenthmarks')?.value) || 0, tenthRollNo: document.getElementById('form-tenthroll')?.value || '',
        optedClass, optedStream, contactNumber, whatsappNumber: document.getElementById('form-whatsappnumber')?.value.trim() || contactNumber,
        email: document.getElementById('form-email')?.value.trim(), residentialAddress, totalFee, paymentPlan, fullPaymentDetails, installments, totalPaid, remainingDue,
        feeStatus: remainingDue === 0 ? 'Full Paid' : totalPaid > 0 ? 'Active Dues' : 'Pending', createdAt: existing?.createdAt || new Date().toISOString(), updatedAt: new Date().toISOString()
      };

      if (isEditing) state.students = state.students.map(s => s.id === studentId ? rec : s);
      else state.students.unshift(rec);

      await mockFirestoreService.saveStudents(state.students);
      state.activeModal = null; state.editingStudentId = null;
      showToast(isEditing ? 'Student Updated' : 'Admission Registered', `${fullName} saved successfully (${sequenceNo}).`, 'success'); render();
    }

    // --- Import Parsing ---
    function handleFileUpload(e) {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = evt => {
        try {
          const wb = XLSX.read(new Uint8Array(evt.target.result), { type: 'array' });
          parseImportRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' }));
        } catch (err) { showToast('Import Error', 'Failed to read Excel workbook: ' + err.message, 'error'); }
      };
      reader.readAsArrayBuffer(file);
    }

    function handlePasteImport() {
      const text = document.getElementById('csv-paste-area')?.value.trim(); if (!text) return showToast('Empty Data', 'Please paste CSV content.', 'warning');
      try {
        const wb = XLSX.read(text, { type: 'string' });
        parseImportRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' }));
      } catch (err) { showToast('Parsing Failed', 'Could not parse text: ' + err.message, 'error'); }
    }

    function parseImportRows(rows) {
      if (!rows?.length) return showToast('No Data', 'No records found in selected file.', 'warning');
      const year = state.filters.academicYear !== 'all' ? state.filters.academicYear : defaultAcademicYear;
      const parsed = rows.map((r, idx) => {
        const getV = pats => { for (const k of Object.keys(r)) { for (const p of pats) if (new RegExp(p, 'i').test(k)) return r[k]; } return ''; };
        const fullName = String(getV(['name', 'student', 'candidate'])).trim() || `Imported Student ${idx + 1}`;
        const fatherName = String(getV(['father', 'guardian', 'parent'])).trim() || 'Not Specified';
        const attendance = normalizeAttendance(getV(['attendance', 'attending', 'mode', 'status']));
        const optedStream = normalizeStream(getV(['stream', 'subject', 'course', 'branch']));
        const optedClass = String(getV(['class', 'grade'])).includes('12') ? 'Class 12' : 'Class 11';
        const dob = normalizeDate(getV(['dob', 'birth', 'date of birth']));
        const contactNumber = String(getV(['contact', 'mobile', 'phone'])).replace(/\D/g, '').substring(0, 10) || '9876543210';
        const totalFee = Number(getV(['fee', 'total fee', 'course fee'])) || 75000, paidAmount = Number(getV(['paid', 'amount paid', 'deposit'])) || 0;
        return {
          id: 'imp_' + Date.now() + '_' + idx, academicYear: year, sequenceNo: generateNextSequenceNo(year, optedClass, optedStream) + '-' + idx,
          attendance, fullName, fatherName, motherName: 'Not Provided', gender: /female|girl|f/i.test(String(getV(['gender', 'sex']))) ? 'Female' : 'Male',
          dob, age: calculateAge(dob), casteCategory: 'General', religion: 'Hindu', nationality: 'Indian', optedClass, optedStream, contactNumber,
          whatsappNumber: contactNumber, email: `${fullName.toLowerCase().replace(/[^a-z]/g, '')}@student.edu`, residentialAddress: String(getV(['address', 'city', 'location'])).trim() || 'Campus Area',
          totalFee, paymentPlan: 'Full Payment', totalPaid: paidAmount, remainingDue: Math.max(0, totalFee - paidAmount),
          feeStatus: paidAmount >= totalFee ? 'Full Paid' : paidAmount > 0 ? 'Active Dues' : 'Pending', createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
        };
      });
      state.importDataState = { rawRows: rows, parsedRows: parsed, step: 'preview' }; render();
    }

    async function commitImportedStudents() {
      const { parsedRows } = state.importDataState; if (!parsedRows?.length) return;
      const year = state.filters.academicYear !== 'all' ? state.filters.academicYear : defaultAcademicYear;
      parsedRows.forEach(s => { s.sequenceNo = generateNextSequenceNo(year, s.optedClass, s.optedStream); state.students.unshift(s); });
      await mockFirestoreService.saveStudents(state.students);
      const c = parsedRows.length; state.importDataState = { rawRows: [], parsedRows: [], step: 'upload' }; state.activeModal = null;
      showToast('Import Complete', `Successfully imported ${c} students.`, 'success'); render();
    }

    async function initApp() {
      if (isFirebaseConfigured && fbAuth) {
        fbAuth.onAuthStateChanged(async user => {
          if (user) {
            state.isLoggedIn = true;
            state.currentUser = {
              uid: user.uid,
              email: user.email,
              displayName: user.displayName || (user.email ? user.email.split('@')[0] : 'Administrator'),
              role: 'Head Accountant & Registrar'
            };
            localStorage.setItem('attendance_auth_user_v1', JSON.stringify(state.currentUser));
          } else {
            const s = localStorage.getItem('attendance_auth_user_v1');
            if (s) { try { state.currentUser = JSON.parse(s); state.isLoggedIn = true; } catch(e){} }
            else { state.isLoggedIn = false; }
          }
          state.students = await firestoreService.fetchStudents();
          state.recycleBin = await firestoreService.fetchRecycleBin();
          render();
        });
      } else {
        state.students = await firestoreService.fetchStudents();
        state.recycleBin = await firestoreService.fetchRecycleBin();
        state.currentUser = firebaseAuthService.getCurrentUser();
        render();
      }
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initApp);
    else initApp();
  </script>
</body>
